<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ config.app_title }}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
        tailwind = window.tailwind || {};
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ["Outfit", "sans-serif"],
                        body: ["Nunito Sans", "sans-serif"],
                    },
                    colors: {
                        brand: {
                            bg: "#f4f7ff",
                            card: "#ffffff",
                            ink: "#10213f",
                            sky: "#2f6df5",
                            aqua: "#19b8b3",
                            coral: "#ff6b59",
                        },
                    },
                },
            },
        };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="min-h-full bg-brand-bg text-brand-ink font-body antialiased">
    <header class="sticky top-0 z-20 border-b border-[#d8e3ff] bg-[#f9fbff]/95 backdrop-blur-md">
        <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-5 py-4">
            <a href="/" class="flex items-center gap-3">
                <img src="/static/icons/logo.svg" alt="Logo" class="h-10 w-10" />
                <div>
                    <p class="font-display text-2xl font-semibold text-brand-ink">{{ config.app_title }}</p>
                    <p class="text-xs uppercase tracking-[0.18em] text-[#4f628f]">Daily Money Command</p>
                </div>
            </a>
            <a href="/api/items" class="rounded-full border border-[#bfd2ff] px-4 py-2 text-sm text-[#2a4d9e] transition hover:border-brand-sky hover:text-brand-sky">
                REST API
            </a>
        </div>
    </header>

    <main class="mx-auto w-full max-w-7xl px-5 py-7 md:py-10">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
